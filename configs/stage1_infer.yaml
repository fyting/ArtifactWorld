# ArtifactWorld stage-1: artifact heatmap / noisemap predictor (homogeneous dual-model, LoRA1).
# Placeholders: __AW_ROOT__ (repo root), __WEIGHTS_ROOT__ (LoRA + aux latents),
# __LTX_MAIN_ROOT__ (Lightricks/LTX-Video root), __LTX_097_DEV_ROOT__ (LTX-Video-0.9.7-dev root with scheduler/ only).
# transformer_source: 0.9.8 distilled single-file under LTX-Video (ltxv-13b-0.9.8-distilled.safetensors).

model:
  model_source: "LTXV_13B_098_DISTILL"
  training_mode: "lora"
  load_checkpoint: "__WEIGHTS_ROOT__/stage1_pred_headmap_lora.safetensors"
  scheduler_source: "__LTX_097_DEV_ROOT__"
  tokenizer_source: "__LTX_MAIN_ROOT__"
  text_encoder_source: "__LTX_MAIN_ROOT__"
  vae_source: "__LTX_MAIN_ROOT__"
  transformer_source: "__LTX_MAIN_ROOT__/ltxv-13b-0.9.8-distilled.safetensors"

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"

conditioning:
  mode: "reference_video"
  first_frame_conditioning_p: 0.2
  reference_latents_dir: "reference_latents"

optimization:
  learning_rate: 2.0e-4
  steps: 7500
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

data:
  preprocessed_data_root: ".precomputed"
  num_dataloader_workers: 8

validation:
  prompts:
    - "predict artifact map"
  reference_videos:
    - "__AW_ROOT__/workspace/.validator_placeholder.mp4"
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  video_dims: [960, 544, 97]
  seed: 42
  inference_steps: 8
  interval: 500
  videos_per_prompt: 1
  guidance_scale: 1.0

checkpoints:
  interval: 500
  keep_last_n: 900

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: false
  project: "artifactworld"
  entity: null
  tags: []
  log_validation_videos: true

seed: 42
output_dir: "__AW_ROOT__/outputs/stage1"
